name: Process Mod Submission

on:
  issues:
    types: [labeled]

concurrency:
  group: process-submissions
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-index:
    if: >
      github.event.sender.login == github.repository_owner &&
      (github.event.label.name == 'approved' || github.event.label.name == 'approved-update')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Save Issue Data to File
        run: |
          echo "$ISSUE_BODY" > issue_body.txt
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Run Processing Script
        run: python process_submission.py
        env:
          ISSUE_BODY_PATH: issue_body.txt

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          if [ -n "$(git status --porcelain mod.json)" ]; then
            git add mod.json
            git commit -m "chore: update index from submission #${{ github.event.issue.number }}"
            git push origin main
          else
            echo "No changes detected in mod.json."
          fi

      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
