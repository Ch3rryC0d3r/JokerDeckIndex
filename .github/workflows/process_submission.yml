name: Process Mod Submission

on:
  issues:
    types: [labeled]

# Queue multiple incoming issue approvals sequentially
concurrency:
  group: process-submissions
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-index:
    # Trigger if approved by the owner AND labeled either submission or update
    if: >
      github.event.sender.login == github.repository_owner && 
      (github.event.label.name == 'approved' || github.event.label.name == 'approved-update')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Save Issue Data to File
        run: |
          echo "$ISSUE_BODY" > issue_body.txt
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Run Processing Script
        run: python process_submission.py
        env:
          ISSUE_BODY_PATH: issue_body.txt

      - name: Commit and Push Changes directly to main
        run: |
          git config --global user.name 'JokerDeckIndexer'
          git config --global user.email 'indexer@jokerdeck.internal'
          
          # Pull latest commits in case a queued workflow completed right before
          git pull --rebase origin main
          
          if ! git diff --exit-code mod.json; then
            git add mod.json
            git commit -m "chore: update index from submission #${{ github.event.issue.number }}"
            git push origin main
          else
            echo "No changes detected in mod.json."
          fi

      - name: Comment on Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Success! The mod has been automatically processed and indexed into `mod.json`."

      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
